<!doctype html>
<html class="dark" lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Titles, descriptions and every share tag come from $lib/Seo.svelte,
		     rendered per page into the head placeholder below. Do not add og:*
		     or twitter:* here: these land BEFORE the per-page ones, and a
		     scraper keeps the first value it sees. Never write the sveltekit
		     head token itself into a comment either - it is substituted
		     wherever it appears, so the injected head lands inside the comment
		     and the rest of the document head is swallowed with it. -->
		%sveltekit.head%
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-GXYWHJEYCP"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());

			gtag('config', 'G-GXYWHJEYCP');
		</script>

	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
